<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Mixel - Ascolta le tue foto!</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        eruda.init();
        console.log("🟦 Eruda inizializzato");
    </script>
</head>

<body>

<div id="loadingOverlay" style="
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 9999;
    color: white;
    font-family: sans-serif;
">
    <div id="loadingText" style="margin-bottom: 12px;">
        Caricamento strumenti in corso…
    </div>

    <div style="width: 80%; height: 10px; background: #333; border-radius: 4px; overflow: hidden;">
        <div id="loadingBar" style="height: 10px; width: 0%; background: #4caf50;"></div>
    </div>
</div>


<!-- OVERLAY ORIENTAMENTO -->
<div id="rotateOverlay" class="rotate-overlay hidden">
    <div class="rotate-box">
        <div class="rotate-icon">🔄</div>
        <p>Ruota il dispositivo per usare l'app</p>
    </div>
</div>

<div class="app-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div id="sidebarLogo" class="sidebar-logo-box">
            <img src="Mixel2.PNG"
                 alt="Logo"
                 style="width: 100%; height: 100%; object-fit: contain;">
        </div>

        <input type="file" id="fileInput" class="file-input">

        <button id="btnElabora" class="side-btn hidden">
    Elabora foto
</button>

<button id="btnSpartito" class="side-btn hidden" style="background: #fff; color: #000; margin-top: 5px;">
    🎼 Spartito
</button>


        <button id="btnConsigliato" class="side-btn hidden">
        </button>

    </aside>

    <!-- CONTENT -->
    <main class="content">
    <div class="video-mini-wrapper">
    <video autoplay muted loop playsinline>
        <source src="onair.mp4" type="video/mp4">
    </video>
</div>
        <div id="heroLogoContainer">
            <div id="heroLogo" class="hero-logo-box">
                <img src="Mixel2.PNG"
                     alt="Logo"
                     style="width: 100%; height: 100%; object-fit: contain;">
            </div>
        </div>

        <img id="previewImage"
             class="preview hidden"
             alt="MIXEL - Ascolta le tue foto!">

        <!-- GENRE PANEL -->
        <div id="genrePanel" class="genre-panel hidden">

            <h2>Scegli il genere musicale</h2>

        <!--    <button class="genre-btn" data-genre="ambient">Ambient</button>
            <button class="genre-btn" data-genre="chiptune">Chiptune</button> -->
            <button class="genre-btn" data-genre="metal">Metal</button>
              <button class="genre-btn" data-genre="piano">Piano</button>

            <button id="closeGenrePanel" class="close-panel-btn">
                Chiudi
            </button>

        </div>

        <!-- PLAYER SLIDE-UP -->
        <div id="playerPanel" class="player-slideup">

            <div id="Player" class="player-ui">

                <div class="player-controls">
                    <button id="btnPlay">▶️ Play</button>
                    <button id="btnPause">⏸️ Pause</button>
                    <button id="btnStop">⏹️ Stop</button>
                    <button id="btnFxPanel">🎛️ Controlli</button>
                </div>

                <div class="player-seek">
                    <input type="range"
                           id="seekBar"
                           min="0"
                           max="100"
                           value="0">
                </div>

                <div class="player-time">
                    <span id="currentTime">0:00</span> /
                    <span id="totalTime">0:00</span>
                </div>

            </div>
        </div>

        <!-- NUOVO: ANALIZZATORE SEPARATO -->
        <div id="spectrumPanel">
            <canvas id="spectrumCanvas"
                    width="300"
                    height="200">
            </canvas>
        </div>

    </main>
</div>

<!-- FX PANEL (FUORI DAL MAIN) -->
<div id="fxPanel" class="fx-panel">

    <div class="fx-header">
        <h2>Controlli Audio</h2>
        <button id="closeFxPanel" class="close-fx-btn">✖</button>
    </div>

    <h3>Equalizzatore Master</h3>

    <label for="eqLow">Bassi</label>
    <input type="range" id="eqLow" min="-12" max="12" value="0">

    <label for="eqMid">Medi</label>
    <input type="range" id="eqMid" min="-12" max="12" value="0">

    <label for="eqHigh">Alti</label>
    <input type="range" id="eqHigh" min="-12" max="12" value="0">

</div>

<script type="module" src="main.js"></script>

</body>
</html>
