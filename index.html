<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Mixel - Ascolta le tue foto!</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
        }
        
        /* Loader iniziale */
        #loader-container {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }
        
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loader-text {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .orientation-badge {
            margin-top: 20px;
            font-size: 12px;
            color: #00ff00;
        }
        
        /* Overlay orientamento */
        .rotate-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
        }
        
        .rotate-overlay.show {
            display: flex;
        }
        
        .rotate-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: rotateAnim 1.5s infinite;
        }
        
        @keyframes rotateAnim {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(90deg); }
        }
        
        /* Container per l'app */
        #app-root {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        /* Stili base che non devono mai mancare */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="loader-container">
        <div class="loader-spinner"></div>
        <div class="loader-text">Caricamento Mixel...</div>
        <div class="orientation-badge">
            Orientamento: <span id="orientation-status">rilevamento...</span>
        </div>
    </div>
    
    <div id="rotateOverlay" class="rotate-overlay">
        <div class="rotate-icon">🔄</div>
        <p>Ruota il dispositivo in VERTICALE<br>per usare l'app</p>
        <p style="font-size: 12px; margin-top: 15px;">(L'app è ottimizzata per uso verticale)</p>
    </div>
    
    <div id="app-root"></div>

    <script>
        // Funzione per rilevare l'orientamento
        function getOrientation() {
            const isPortrait = window.matchMedia("(orientation: portrait)").matches || 
                              (window.innerHeight > window.innerWidth);
            return isPortrait ? 'portrait' : 'landscape';
        }
        
        // Funzione per caricare CSS
        function loadStylesheet(href) {
            return new Promise((resolve, reject) => {
                const link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = href;
                link.onload = resolve;
                link.onerror = reject;
                document.head.appendChild(link);
            });
        }
        
        // Funzione per caricare JS
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.type = 'module';
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        }
        
        // Funzione per caricare l'HTML della UI
        async function loadUI(orientation) {
            const appRoot = document.getElementById('app-root');
            const statusSpan = document.getElementById('orientation-status');
            
            if (orientation === 'portrait') {
                statusSpan.textContent = 'VERTICALE';
                console.log('📱 Caricamento versione VERTICALE');
                
                // Carica il contenuto HTML verticale
                appRoot.innerHTML = `
                    <div class="app-container">
                        <header class="app-header">
                            <div class="logo-box">
                                <img src="Mixel.jpg" alt="Logo">
                            </div>
                            <div class="upload-area">
                                <input type="file" id="fileInput" accept="image/*">
                                <label for="fileInput" class="upload-btn">📸 Carica foto</label>
                            </div>
                            <button id="btnElabora" class="elabora-btn hidden">✨ Elabora foto</button>
                        </header>

                        <main class="content">
                            <div class="video-mini-wrapper">
                                <video autoplay muted loop playsinline>
                                    <source src="onair.mp4" type="video/mp4">
                                </video>
                            </div>

                            <div id="heroLogoContainer" class="hero-container">
                                <div class="hero-logo-box">
                                    <img src="Mixel.jpg" alt="Logo">
                                </div>
                            </div>

                            <img id="previewImage" class="preview hidden" alt="MIXEL">

                            <div id="spectrumPanel" class="spectrum-panel hidden">
                                <canvas id="spectrumCanvas"></canvas>
                            </div>

                            <div id="playerPanel" class="player-panel hidden">
                                <div class="player-ui">
                                    <div class="player-controls">
                                        <button id="btnPlay">▶️ Play</button>
                                        <button id="btnPause">⏸️ Pause</button>
                                        <button id="btnStop">⏹️ Stop</button>
                                        <button id="btnFxPanel">🎛️ FX</button>
                                        <button id="btnSpartito" class="spartito-btn hidden">🎼 Spartito</button>
                                    </div>
                                    <div class="player-seek">
                                        <input type="range" id="seekBar" min="0" max="100" value="0">
                                    </div>
                                    <div class="player-time">
                                        <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>

                    <div id="genrePanel" class="genre-panel">
                        <div class="panel-header">
                            <h2>Scegli il genere musicale</h2>
                            <button id="closeGenrePanel" class="close-panel-btn">✖</button>
                        </div>
                        <div class="genre-buttons">
                            <button class="genre-btn" data-genre="dance">🎧 Dance '90</button>
                            <button class="genre-btn" data-genre="metal">🤘 Metal</button>
                            <button class="genre-btn" data-genre="orchestra">🎻 Orchestra</button>
                            <button class="genre-btn" data-genre="piano">🎹 Piano</button>
                        </div>
                    </div>

                    <div id="fxPanel" class="fx-panel">
                        <div class="panel-header">
                            <h2>Controlli Audio</h2>
                            <button id="closeFxPanel" class="close-panel-btn">✖</button>
                        </div>
                        <div class="fx-section">
                            <h3>Equalizzatore Master</h3>
                            <div class="fx-control">
                                <label for="eqLow">Bassi</label>
                                <input type="range" id="eqLow" min="-12" max="12" value="0">
                            </div>
                            <div class="fx-control">
                                <label for="eqMid">Medi</label>
                                <input type="range" id="eqMid" min="-12" max="12" value="0">
                            </div>
                            <div class="fx-control">
                                <label for="eqHigh">Alti</label>
                                <input type="range" id="eqHigh" min="-12" max="12" value="0">
                            </div>
                        </div>
                        <div id="volumeControls" class="fx-section">
                            <h3>Volumi Strumenti</h3>
                        </div>
                    </div>
                `;
                
                // Carica CSS e JS verticali
                await loadStylesheet('style-vertical.css');
                await loadScript('main-vertical.js');
                
            } else {
                statusSpan.textContent = 'ORIZZONTALE';
                console.log('📱 Caricamento versione ORIZZONTALE');
                
                // Carica il contenuto HTML orizzontale
                appRoot.innerHTML = `
                    <div class="app-container">
                        <aside class="sidebar">
                            <div class="sidebar-logo-box">
                                <img src="Mixel.jpg" alt="Logo">
                            </div>
                            <input type="file" id="fileInput" class="file-input">
                            <button id="btnElabora" class="side-btn hidden">✨ Elabora foto</button>
                            <button id="btnSpartito" class="side-btn hidden" style="background:#fff;color:#000;">🎼 Spartito</button>
                        </aside>

                        <main class="content">
                            <div class="video-mini-wrapper">
                                <video autoplay muted loop playsinline>
                                    <source src="onair.mp4" type="video/mp4">
                                </video>
                            </div>

                            <div id="heroLogoContainer">
                                <div class="hero-logo-box">
                                    <img src="Mixel.jpg" alt="Logo">
                                </div>
                            </div>

                            <img id="previewImage" class="preview hidden" alt="MIXEL">

                            <div id="genrePanel" class="genre-panel hidden">
                                <h2>Scegli il genere musicale</h2>
                                <button class="genre-btn" data-genre="dance">🎧 Dance '90</button>
                                <button class="genre-btn" data-genre="metal">🤘 Metal</button>
                                <button class="genre-btn" data-genre="orchestra">🎻 Orchestra</button>
                                <button class="genre-btn" data-genre="piano">🎹 Piano</button>
                                <button id="closeGenrePanel" class="close-panel-btn">Chiudi</button>
                            </div>

                            <div id="playerPanel" class="player-slideup">
                                <div class="player-ui">
                                    <div class="player-controls">
                                        <button id="btnPlay">▶️ Play</button>
                                        <button id="btnPause">⏸️ Pause</button>
                                        <button id="btnStop">⏹️ Stop</button>
                                        <button id="btnFxPanel">🎛️ Controlli</button>
                                    </div>
                                    <div class="player-seek">
                                        <input type="range" id="seekBar" min="0" max="100" value="0">
                                    </div>
                                    <div class="player-time">
                                        <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
                                    </div>
                                </div>
                            </div>

                            <div id="spectrumPanel">
                                <canvas id="spectrumCanvas" width="300" height="200"></canvas>
                            </div>
                        </main>
                    </div>

                    <div id="fxPanel" class="fx-panel">
                        <div class="fx-header">
                            <h2>Controlli Audio</h2>
                            <button id="closeFxPanel" class="close-fx-btn">✖</button>
                        </div>
                        <h3>Equalizzatore Master</h3>
                        <label for="eqLow">Bassi</label>
                        <input type="range" id="eqLow" min="-12" max="12" value="0">
                        <label for="eqMid">Medi</label>
                        <input type="range" id="eqMid" min="-12" max="12" value="0">
                        <label for="eqHigh">Alti</label>
                        <input type="range" id="eqHigh" min="-12" max="12" value="0">
                    </div>
                `;
                
                // Carica CSS e JS orizzontali
                await loadStylesheet('style-horizontal.css');
                await loadScript('main-horizontal.js');
            }
        }
        
        // Variabile per tenere traccia dell'orientamento corrente
        let currentOrientation = getOrientation();
        
        // Avvia l'app
        async function startApp() {
            try {
                await loadUI(currentOrientation);
                
                // Nascondi loader dopo un breve delay
                setTimeout(() => {
                    const loader = document.getElementById('loader-container');
                    if (loader) {
                        loader.style.opacity = '0';
                        setTimeout(() => {
                            loader.style.display = 'none';
                        }, 500);
                    }
                }, 500);
            } catch (error) {
                console.error('Errore nel caricamento:', error);
                document.getElementById('orientation-status').textContent = 'ERRORE';
            }
        }
        
        // Gestione cambio orientamento
        function handleOrientationChange() {
            const newOrientation = getOrientation();
            const rotateOverlay = document.getElementById('rotateOverlay');
            
            // Se stai usando solo verticale, mostra overlay in orizzontale
            if (newOrientation === 'landscape' && currentOrientation === 'portrait') {
                rotateOverlay.classList.add('show');
                // Metti in pausa l'audio se attivo
                if (window.currentEngine) {
                    window.currentEngine.pause();
                }
            } else if (newOrientation === 'portrait' && currentOrientation === 'landscape') {
                rotateOverlay.classList.remove('show');
                // Ricarica la versione verticale
                location.reload();
            } else if (newOrientation !== currentOrientation) {
                // Ricarica la pagina per applicare la versione corretta
                location.reload();
            }
        }
        
        // Ascolta cambi di orientamento
        window.addEventListener('resize', () => {
            setTimeout(handleOrientationChange, 100);
        });
        window.addEventListener('orientationchange', () => {
            setTimeout(handleOrientationChange, 100);
        });
        
        // Avvia tutto
        startApp();
    </script>
</body>
</html>
