<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mixel - Music Experience</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="portrait">

    <!-- Overlay Caricamento -->
    <div id="loadingOverlay" style="display:none;">
        <div id="loadingText">Analisi immagine in corso...</div>
    </div>

    <div class="app-container">
        <!-- SIDEBAR (Orizzontale) -->
        <aside class="sidebar">
            <div class="sidebar-logo"><img src="Mixel.jpg"></div>
            <nav class="sidebar-nav">
                <label class="file-label">
                    <span>📸 Carica Foto</span>
                    <input type="file" id="fileInputLandscape" accept="image/*">
                </label>
                <button id="btnElaboraLandscape" class="btn-action hidden">✨ Elabora</button>
                <button id="btnSpartitoLandscape" class="btn-action hidden">🎼 Spartito</button>
            </nav>
        </aside>

        <!-- HEADER (Verticale) -->
        <header class="app-header">
            <div class="header-logo"><img src="Mixel.jpg"></div>
            <div class="header-actions">
                <label class="upload-icon">
                    📸 <input type="file" id="fileInputPortrait" accept="image/*">
                </label>
                <button id="btnElaboraPortrait" class="btn-action hidden">✨ Elabora</button>
            </div>
        </header>

        <!-- CONTENUTO PRINCIPALE -->
        <main class="main-content">
            <div class="video-bg">
                <video autoplay muted loop playsinline><source src="onair.mp4" type="video/mp4"></video>
            </div>

            <div id="heroLogoContainer" class="hero-container">
                <img src="Mixel.jpg" class="hero-logo">
            </div>

            <img id="previewImage" class="preview-img hidden">

            <!-- Spettro Audio -->
            <div id="spectrumPanel" class="spectrum-container hidden">
                <canvas id="spectrumCanvas"></canvas>
            </div>

            <!-- Player Bar -->
            <div id="playerPanel" class="player-bar hidden">
                <div class="player-inner">
                    <div class="transport-btns">
                        <button id="btnPlay">▶</button>
                        <button id="btnPause">II</button>
                        <button id="btnStop">■</button>
                        <button id="btnFxPanel">🎛️</button>
                    </div>
                    <div class="progress-area">
                        <input type="range" id="seekBar" value="0" step="0.1">
                        <div class="time-info">
                            <span id="currentTime">0:00</span> / <span id="totalTime">0:00</span>
                        </div>
                    </div>
                    <button id="btnSpartitoPortrait" class="spartito-mini-btn">🎼</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Pannelli Overlay -->
    <div id="genrePanel" class="panel-overlay">
        <div class="panel-content">
            <h2>Scegli Genere</h2>
            <div class="grid-btns">
                <button class="genre-btn" data-genre="piano">🎹 Piano</button>
                <button class="genre-btn" data-genre="dance">🎧 Dance</button>
                <button class="genre-btn" data-genre="orchestra">🎻 Orchestra</button>
            </div>
            <button class="close-btn" id="closeGenre">Annulla</button>
        </div>
    </div>

    <div id="fxPanel" class="panel-overlay">
        <div class="panel-content">
            <h2>Effetti Audio</h2>
            <div id="volumeControls"></div>
            <button class="close-btn" id="closeFx">Chiudi</button>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
