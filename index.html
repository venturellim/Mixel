<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Mixel - Ascolta le tue foto!</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        
        #loader-container {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loader-text {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .orientation-badge {
            margin-top: 20px;
            font-size: 12px;
            color: #00ff00;
        }
        
        #orientation-status {
            font-weight: bold;
            color: #ffa500;
        }
    </style>
</head>
<body>
    <div id="loader-container">
        <div class="loader-spinner"></div>
        <div class="loader-text">Caricamento Mixel...</div>
        <div class="orientation-badge">
            Orientamento rilevato: <span id="orientation-status">...</span>
        </div>
        <div class="orientation-badge" style="font-size: 10px; margin-top: 10px;">
            🔄 Ruota il dispositivo se necessario
        </div>
    </div>

    <script>
        // Funzione per rilevare l'orientamento
        function getOrientation() {
            const isPortrait = window.matchMedia("(orientation: portrait)").matches || 
                              (window.innerHeight > window.innerWidth);
            return isPortrait ? 'portrait' : 'landscape';
        }
        
        // Funzione per caricare la versione appropriata
        function loadVersion(orientation) {
            const statusSpan = document.getElementById('orientation-status');
            const loaderContainer = document.getElementById('loader-container');
            
            if (orientation === 'portrait') {
                statusSpan.textContent = 'PORTRAIT (Verticale)';
                console.log('📱 Caricamento versione VERTICALE');
                
                // Carica i file della versione verticale
                loadStylesheet('style-vertical.css');
                loadScript('main-vertical.js');
            } else {
                statusSpan.textContent = 'LANDSCAPE (Orizzontale)';
                console.log('📱 Caricamento versione ORIZZONTALE');
                
                // Carica i file della versione orizzontale
                loadStylesheet('style-horizontal.css');
                loadScript('main-horizontal.js');
            }
            
            // Nascondi il loader dopo 1 secondo (o quando i file sono caricati)
            setTimeout(() => {
                loaderContainer.style.opacity = '0';
                setTimeout(() => {
                    loaderContainer.style.display = 'none';
                }, 500);
            }, 1000);
        }
        
        // Helper per caricare CSS
        function loadStylesheet(href) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            document.head.appendChild(link);
        }
        
        // Helper per caricare JS
        function loadScript(src) {
            const script = document.createElement('script');
            script.type = 'module';
            script.src = src;
            document.body.appendChild(script);
        }
        
        // Rileva l'orientamento iniziale
        let currentOrientation = getOrientation();
        loadVersion(currentOrientation);
        
        // Ascolta i cambi di orientamento DOPO il caricamento
        window.addEventListener('resize', () => {
            const newOrientation = getOrientation();
            if (newOrientation !== currentOrientation) {
                currentOrientation = newOrientation;
                // Ricarica la pagina per applicare la versione corretta
                location.reload();
            }
        });
        
        // Usa anche orientationchange per compatibilità
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                const newOrientation = getOrientation();
                if (newOrientation !== currentOrientation) {
                    currentOrientation = newOrientation;
                    location.reload();
                }
            }, 100);
        });
    </script>
</body>
</html>
