// ======================================================
// MASTER EQ (Equalizzatore 3 bande)
// ======================================================
const masterEQ = new Tone.EQ3({
    low: 0,   // dB
    mid: 0,   // dB
    high: 0   // dB
}).toDestination();

// ======================================================
// EFFETTI PER LA CHITARRA LEAD
// ======================================================

// EQ dedicato al lead
const leadEQ = new Tone.EQ3({
    low: -6,
    mid: 0,
    high: 3
});

// Chorus (profondità + movimento)
const leadChorus = new Tone.Chorus({
    frequency: 4,
    delayTime: 2.5,
    depth: 0.3,
    wet: 0.3
}).start();

// Delay (feedback moderato)
const leadDelay = new Tone.FeedbackDelay({
    delayTime: "8n",
    feedback: 0.35,
    wet: 0.3
});

// Riverbero (ambiente ampio)
const leadReverb = new Tone.Reverb({
    decay: 2.5,
    wet: 0.25
});

// AutoWah (effetto wah automatico)
const leadAutoWah = new Tone.AutoWah({
    baseFrequency: 100,
    octaves: 4,
    sensitivity: 0,
    Q: 2,
    gain: 2,
    wet: 0.0
});

// ======================================================
// CATENA EFFETTI LEAD → MASTER EQ
// ======================================================
// EQ → Chorus → Delay → Reverb → AutoWah → Master
leadEQ.connect(leadChorus);
leadChorus.connect(leadDelay);
leadDelay.connect(leadReverb);
leadReverb.connect(leadAutoWah);
leadAutoWah.connect(masterEQ);



// creazione strumenti

const drums = new Tone.Players({

guitarRhithm.volume.value = +4;   // chitarra ritmica più forte
guitarLead.volume.value   = +6;   // lead molto più udibile
bass.volume.value         = +2;   // basso più presente

// ==========================================
// MIXEL ENGINE V2
// ==========================================
document.addEventListener("DOMContentLoaded", () => {

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const imageLoader = document.getElementById("imageLoader");
    const playBtn = document.getElementById("playBtn");

    let dna = null;

    // ======================================
    // IMAGE LOAD
    // ======================================
    imageLoader.addEventListener("change", (e) => {

        const reader = new FileReader();

        reader.onload = function(event) {
            const img = new Image();

            img.onload = function() {

                canvas.width = 64;
                canvas.height = 64;
                ctx.drawImage(img, 0, 0, 64, 64);

                dna = extractDNA();
                console.log("DNA:", dna);
            };

            img.src = event.target.result;
        };

        reader.readAsDataURL(e.target.files[0]);
    });

    // ======================================
    // DNA EXTRACTION
    // ======================================
    function extractDNA() {

        const data = ctx.getImageData(0, 0, 64, 64).data;

        let brightness = 0;
        let contrast = 0;

        for (let i = 0; i < data.length; i += 16) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];

            brightness += (r + g + b) / 3;
            contrast += Math.abs(r - g) + Math.abs(g - b);
        }

        brightness /= (64 * 64 / 4);
        contrast /= (64 * 64 / 4);

        return {
            brightness,
            contrast,
            energy: (brightness + contrast) / 2
        };
    }

    // ======================================
    // PLAY BUTTON
    // ======================================
    playBtn.addEventListener("click", async () => {

        if (!dna) {
            alert("Carica un'immagine prima!");
            return;
        }

        await Tone.start();
        await Tone.loaded();
        console.log(guitarRhithm.loaded);
console.log(bass.loaded);
        Tone.Transport.stop();
        Tone.Transport.cancel();

        buildSong(dna);

        Tone.Transport.start();
    });

});

function buildSong(dna) {

    const bpm = 135 + Math.floor((dna.energy / 255) * 20);
    Tone.Transport.bpm.value = bpm;

    const isMajor = dna.brightness > 127;
    const keyRoots = ["C","D","E","F","G","A","B"];
    const root = keyRoots[Math.floor((dna.brightness / 255) * keyRoots.length)];

    const scale = generateScale(root, isMajor);
    const progression = generateProgression(dna.contrast, scale);

    let bar = 0;

    // INTRO (4)
    buildDrums(bar, 4);
    buildSection(bar, progression, scale);
    bar += 4;
    buildRhythmGuitar(bar, 4, progression);
/*bar += 4;
buildBass(bar, 4, progression);
bar += 4;*/

    // STROFA (8)
    buildDrums(bar, 8);
    buildSection(bar, progression, scale);
    bar += 8;
    buildRhythmGuitar(bar, 4, progression);
/*bar += 4;
buildBass(bar, 4, progression);
bar += 4;*/

    // RITORNELLO (8)
    buildDrums(bar, 8);
    buildSection(bar, progression, scale);
    bar += 8;
    buildRhythmGuitar(bar, 4, progression);
/*bar += 4;
buildBass(bar, 4, progression);
bar += 4;*/

    // ASSOLO (8)
    buildDrums(bar, 8);
    buildSection(bar, progression, scale);
    bar += 8;
    buildRhythmGuitar(bar, 4, progression);
/*bar += 4;
buildBass(bar, 4, progression);
bar += 4;*/

    // RITORNELLO (8)
    buildDrums(bar, 8);
    buildSection(bar, progression, scale);
    
    buildRhythmGuitar(bar, 4, progression);
/*bar += 4;
buildBass(bar, 4, progression);*/
bar += 4;
}

function generateScale(root, isMajor) {

    const major = [0,2,4,5,7,9,11];
    const minor = [0,2,3,5,7,8,10];

    const intervals = isMajor ? major : minor;

    const notes = [];

    const base = Tone.Frequency(root + "3").toMidi();

    intervals.forEach(i => {
        notes.push(Tone.Frequency(base + i, "midi").toNote());
    });

    return notes;
}

function generateProgression(contrast, scale) {

    const low = [0,5,2,6];
    const mid = [0,6,5,6];
    const high = [0,4,5,2];

    let pattern;

    if (contrast < 80) pattern = low;
    else if (contrast < 160) pattern = mid;
    else pattern = high;

    return pattern.map(i => scale[i]);
}

function buildSection(startBar, progression, scale) {

    const events = [];

    progression.forEach((chordRoot, barIndex) => {

        const barTime = `${startBar + barIndex}m`;

        for (let i = 0; i < 8; i++) {

            events.push({
                time: Tone.Time(barTime) + Tone.Time("8n") * i,
                note: chordRoot
            });

        }

    });

    const rhythmPart = new Tone.Part((time, value) => {
        guitar.triggerAttackRelease(value.note, "8n", time);
        bass.triggerAttackRelease(value.note, "8n", time);
    }, events).start(0);

}

function buildDrums(startBar, bars) {

    const events = [];

    // Crash apertura
    events.push({
        time: `${startBar}m`,
        type: "crash"
    });

    for (let bar = 0; bar < bars; bar++) {

        const barTime = Tone.Time(`${startBar + bar}m`);

        // HiHat 8th
        for (let i = 0; i < 8; i++) {
            events.push({
                time: barTime + Tone.Time("8n") * i,
                type: "hihat"
            });
        }

        // Kick 1 e 3
        events.push({ time: barTime, type: "kick" });
        events.push({ time: barTime + Tone.Time("2n"), type: "kick" });

        // Snare 2 e 4
        events.push({ time: barTime + Tone.Time("4n"), type: "snare" });
        events.push({ time: barTime + Tone.Time("4n") * 3, type: "snare" });
    }

    const drumPart = new Tone.Part((time, ev) => {

        switch (ev.type) {
            case "kick":
                drums.player("kick").start(time);
                break;
            case "snare":
                drums.player("snare").start(time);
                break;
            case "hihat":
                drums.player("hihat").start(time);
                break;
            case "crash":
                drums.player("crash").start(time);
                break;
        }

    }, events).start(0);

    drumPart.loop = false;
}

function buildRhythmGuitar(startBar, bars, progression) {

    const events = [];

    for (let bar = 0; bar < bars; bar++) {

        const root = progression[bar % progression.length];

        for (let i = 0; i < 8; i++) {

            const barIndex = startBar + bar;
            const sixteenth = i * 2;

            const time = `${barIndex}:${Math.floor(sixteenth/4)}:${sixteenth%4}`;

            const rootNote = root + "3";
            const fifthNote = Tone.Frequency(rootNote).transpose(7).toNote();
            const octaveNote = Tone.Frequency(rootNote).transpose(12).toNote();

            events.push({
                time: time,
                chord: [rootNote, fifthNote, octaveNote],
                open: i === 0
            });
        }
    }

    new Tone.Part((time, ev) => {

        if (ev.open) {
            guitarRhythm.triggerAttackRelease(ev.chord, "8n", time);
        } else {
            guitarRhythm.triggerAttackRelease(ev.chord, "16n", time);
        }

    }, events).start(0);
}

function buildBass(startBar, bars, progression) {

    const events = [];

    for (let bar = 0; bar < bars; bar++) {

        const rootNote = progression[bar % progression.length];
        const nextRoot = progression[(bar + 1) % progression.length];

        const barTime = Tone.Time(`${startBar + bar}m`);

        const rootMidi = Tone.Frequency(rootNote + "2").toMidi();
        const fifthMidi = rootMidi + 7;

        const root = Tone.Frequency(rootMidi, "midi").toNote();
        const fifth = Tone.Frequency(fifthMidi, "midi").toNote();

        for (let i = 0; i < 8; i++) {

            let note;

            if (i === 7) {
                // Approccio al prossimo accordo
                const approachMidi = Tone.Frequency(nextRoot + "2").toMidi() - 1;
                note = Tone.Frequency(approachMidi, "midi").toNote();
            } else if (i % 2 === 0) {
                note = root;
            } else {
                note = fifth;
            }

            events.push({
                time: barTime + Tone.Time("8n") * i,
                note: note
            });
        }
    }

    const part = new Tone.Part((time, ev) => {

        bass.triggerAttackRelease(
            ev.note,
            "8n",
            time,
            0.9
        );

    }, events).start(0);

    part.loop = false;
}
