<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Mixel - Ascolta le tue foto!</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
        }
        
        /* Loader iniziale */
        #loader-container {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            transition: opacity 0.5s ease;
        }
        
        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loader-text {
            font-size: 14px;
            opacity: 0.8;
            color: white;
            font-family: sans-serif;
        }
        
        .orientation-badge {
            margin-top: 20px;
            font-size: 12px;
            color: #00ff00;
            font-family: sans-serif;
        }
        
        #app-root {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        /* Stili di base per evitare flash bianco */
        .app-container, .sidebar, .content, .genre-panel, .fx-panel {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loader-container">
        <div class="loader-spinner"></div>
        <div class="loader-text">Caricamento Mixel...</div>
        <div class="orientation-badge">
            Versione: <span id="version-status">rilevamento...</span>
        </div>
    </div>
    
    <div id="app-root"></div>

    <script>
        // Funzione per rilevare l'orientamento
        function getOrientation() {
            var isPortrait = window.matchMedia("(orientation: portrait)").matches || 
                              (window.innerHeight > window.innerWidth);
            return isPortrait ? 'portrait' : 'landscape';
        }
        
        // Funzione per caricare CSS dinamicamente
        function loadCSS(href) {
            return new Promise(function(resolve, reject) {
                // Rimuovi eventuali CSS precedenti della stessa versione
                var existing = document.querySelector('link[href="' + href + '"]');
                if (existing) {
                    resolve();
                    return;
                }
                var link = document.createElement('link');
                link.rel = 'stylesheet';
                link.href = href;
                link.onload = resolve;
                link.onerror = reject;
                document.head.appendChild(link);
            });
        }
        
        // Funzione per caricare JS dinamicamente
        function loadJS(src) {
            return new Promise(function(resolve, reject) {
                var existing = document.querySelector('script[src="' + src + '"]');
                if (existing) {
                    resolve();
                    return;
                }
                var script = document.createElement('script');
                script.type = 'module';
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.body.appendChild(script);
            });
        }
        
        // Funzione per caricare HTML da file
        function loadHTML(url) {
            return fetch(url)
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error('HTTP error ' + response.status);
                    }
                    return response.text();
                })
                .then(function(html) {
                    // Estrae solo il contenuto del body
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(html, 'text/html');
                    return doc.body.innerHTML;
                });
        }
        
        var currentOrientation = getOrientation();
        var versionSpan = document.getElementById('version-status');
        var appRoot = document.getElementById('app-root');
        
        async function loadApp() {
            var orientation = getOrientation();
            currentOrientation = orientation;
            
            try {
                if (orientation === 'portrait') {
                    versionSpan.textContent = 'VERTICALE';
                    console.log('📱 Caricamento versione VERTICALE');
                    
                    // Carica l'HTML dal file verticale
                    var verticalHTML = await loadHTML('index-vertical.html');
                    appRoot.innerHTML = verticalHTML;
                    
                    // Carica CSS e JS
                    await loadCSS('style-vertical.css');
                    await loadJS('main-vertical.js');
                    
                } else {
                    versionSpan.textContent = 'ORIZZONTALE';
                    console.log('📱 Caricamento versione ORIZZONTALE');
                    
                    // Carica l'HTML dal file orizzontale
                    var horizontalHTML = await loadHTML('index-horizontal.html');
                    appRoot.innerHTML = horizontalHTML;
                    
                    // Carica CSS e JS
                    await loadCSS('style-horizontal.css');
                    await loadJS('main-horizontal.js');
                }
                
                // Nascondi loader
                var loader = document.getElementById('loader-container');
                if (loader) {
                    loader.style.opacity = '0';
                    setTimeout(function() {
                        loader.style.display = 'none';
                    }, 500);
                }
                
            } catch (error) {
                console.error('Errore nel caricamento:', error);
                versionSpan.textContent = 'ERRORE: ' + error.message;
            }
        }
        
        // Gestione cambio orientamento
        var reloadTimeout = null;
        
        function handleOrientationChange() {
            var newOrientation = getOrientation();
            
            if (newOrientation !== currentOrientation) {
                console.log('🔄 Orientamento cambiato: ' + currentOrientation + ' → ' + newOrientation);
                
                if (reloadTimeout) clearTimeout(reloadTimeout);
                reloadTimeout = setTimeout(function() {
                    location.reload();
                }, 150);
            }
        }
        
        // Ascolta cambi di orientamento
        window.addEventListener('resize', handleOrientationChange);
        window.addEventListener('orientationchange', handleOrientationChange);
        
        // Avvia l'app
        loadApp();
    </script>
</body>
</html>
