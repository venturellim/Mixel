<!-- fxControls.html -->
<!-- Da includere nella tua pagina principale -->

<div id="fx-toggle" title="Toggle FX Panel">🎛️</div>

<div id="fx-panel" style="display:none;">
    <div class="fx-header">
        <h3>🎛️ FX Controls</h3>
        <button id="fx-close">✕</button>
    </div>
    
    <div class="fx-search">
        <input type="text" id="fx-search" placeholder="🔍 Cerca effetto...">
    </div>
    
    <div id="fx-content">
        <!-- Gli effetti vengono generati dinamicamente -->
    </div>
    
    <div class="fx-footer">
        <button id="fx-reset">🔄 Reset All</button>
        <span id="fx-status">✅ Live</span>
    </div>
</div>
